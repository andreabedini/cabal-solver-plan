name: CI

# build compiles the project once per target and GHC, runs its test suites,
# and uploads the executable as an archive; test unpacks that archive on a
# separate runner, without a build tree, and runs tests/run.sh on it; sdist
# makes the source distribution of every package in cabal.project; dist
# checks the versions of the tested archives and the source distributions,
# and uploads them with SHA256SUMS as one artifact; commits checks the
# commit messages of a PR; ci-ok is the one check that the ruleset requires;
# release publishes dist when the head of main is a release commit, made by
# `mise run release-pr`. Nothing is rebuilt after testing.
#
# A manual run (Actions > CI > Run workflow, or `gh workflow run ci.yml
# --ref BRANCH`) makes every artifact of a release, in dist, without
# releasing: release runs only on a push to main.
#
# The project has no library, so there is no documentation to build or
# publish: no docs or pages jobs.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CABAL_VERSION: 3.18.1.0
  # Release archives come from the builds with this GHC.
  # It must be one of matrix.ghc, normally the newest.
  RELEASE_GHC: 9.14.1
  # The executables that a release publishes, by name, separated by spaces.
  # Only these go into the archives; other executables in the project are
  # built and tested but not published.
  EXECUTABLES: cabal-solver-plan
  # Archives are ARCHIVE_NAME-VERSION-TARGET.tar.gz (.zip on Windows).
  ARCHIVE_NAME: cabal-solver-plan
  # Any package's .cabal file: every package has the version of the release.
  VERSION_FROM: cabal-solver-plan.cabal

jobs:
  build:
    name: Build ${{ matrix.target }}, GHC ${{ matrix.ghc }}
    runs-on: ${{ matrix.build-runner }}

    strategy: &strategy
      fail-fast: false
      matrix:
        ghc:
          - 9.12.2
          - 9.14.1
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
        include:
          # Linux builds run on the oldest runner, as the binaries need a
          # glibc at least as new as the one they were built with.
          - target: x86_64-linux
            build-runner: ubuntu-22.04
            test-runner: ubuntu-latest
          - target: aarch64-linux
            build-runner: ubuntu-22.04-arm
            test-runner: ubuntu-24.04-arm
          - target: x86_64-macos
            build-runner: macos-15-intel
            test-runner: macos-15-intel
          - target: aarch64-macos
            build-runner: macos-15
            test-runner: macos-latest
          - target: x86_64-windows
            build-runner: windows-2025
            test-runner: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Plan
        run: cabal build all --enable-tests --dry-run

      - name: Restore cabal store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-store-${{ matrix.target }}-ghc-${{ matrix.ghc }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-store-${{ matrix.target }}-ghc-${{ matrix.ghc }}-

      - name: Build dependencies
        run: cabal build all --enable-tests --only-dependencies -j

      - name: Save cabal store
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: |
          cabal build all --enable-tests -j
          mkdir out
          for exe in $EXECUTABLES; do
            cp "$(cabal list-bin "exe:$exe")" out/
          done
          version=$(sed -nE 's/^version:[[:space:]]+//p' "$VERSION_FROM")
          echo "ARCHIVE=$ARCHIVE_NAME-$version-${{ matrix.target }}" >> "$GITHUB_ENV"

      # "No tests to run" when the project has no test suites.
      - name: Test
        run: cabal test all --test-show-details=direct

      - name: Strip
        if: runner.os != 'Windows'
        working-directory: out
        run: strip $EXECUTABLES

      # strip invalidates the linker's ad-hoc signature.
      - name: Sign
        if: runner.os == 'macOS'
        working-directory: out
        run: codesign --force --sign - $EXECUTABLES

      # The executables must only need libraries that every distribution has,
      # with a stable ABI.
      - name: Check shared libraries
        if: runner.os == 'Linux'
        working-directory: out
        run: |
          for exe in $EXECUTABLES; do
            needed=$(readelf -d "$exe" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
            echo "$exe: $needed"
            if grep -vxE 'libc\.so\.6|libm\.so\.6|libz\.so\.1|libgmp\.so\.10|ld-linux-.*\.so\.[0-9]+' <<< "$needed"; then
              echo "::error::unexpected shared library dependencies of $exe (above)"
              exit 1
            fi
          done

      # Only system libraries; e.g. no Homebrew gmp.
      - name: Check shared libraries
        if: runner.os == 'macOS'
        working-directory: out
        run: |
          for exe in $EXECUTABLES; do
            needed=$(otool -L "$exe" | tail -n +2 | awk '{print $1}')
            echo "$exe: $needed"
            if grep -vE '^(/usr/lib/|/System/Library/)' <<< "$needed"; then
              echo "::error::unexpected shared library dependencies of $exe (above)"
              exit 1
            fi
          done

      - name: Archive
        if: runner.os != 'Windows'
        working-directory: out
        run: tar -czf "../$ARCHIVE.tar.gz" $EXECUTABLES

      - name: Archive
        if: runner.os == 'Windows'
        working-directory: out
        run: 7z a "../$ARCHIVE.zip" ./*.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-ghc-${{ matrix.ghc }}
          path: ${{ env.ARCHIVE }}.*
          if-no-files-found: error

  test:
    name: Test ${{ matrix.target }}, GHC ${{ matrix.ghc }}
    needs: build
    runs-on: ${{ matrix.test-runner }}
    strategy: *strategy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target }}-ghc-${{ matrix.ghc }}
          path: artifact

      - name: Unpack
        if: runner.os != 'Windows'
        run: mkdir bin && tar -xzf artifact/*.tar.gz -C bin

      - name: Unpack
        if: runner.os == 'Windows'
        run: 7z x -obin artifact/*.zip

      # Only for the smoke test with --with-ghc.
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: false

      # The golden tests only read the index up to a fixed index-state, so an
      # old copy of it is as good as a new one.
      - name: Cache Hackage index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _cache
          key: hackage-index-${{ runner.os }}

      - name: Test
        run: sh tests/run.sh bin/cabal-solver-plan

  # The source distributions of every package in cabal.project, as cabal
  # sdist makes them: only the files that the .cabal files list, unlike a
  # checkout of the repository. cabal sdist needs no GHC and its tarballs
  # are reproducible.
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ env.RELEASE_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: false

      - name: Make source distributions
        run: cabal sdist all -o sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: sdist/*.tar.gz
          if-no-files-found: error

  # Every commit of a PR must follow Conventional Commits, with a type that a
  # commit parser in cliff.toml knows: the release task reads them to choose
  # the next version and to write CHANGELOG.md. git-cliff checks the PR's
  # commits with cliff.toml, without the filters that drop unconventional and
  # unmatched commits from the changelog, and fails on either kind.
  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Conventional Commits
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          # The same version as in mise.toml.
          version: v2.14.2
          args: --verbose origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}
        env:
          GIT_CLIFF__GIT__FILTER_UNCONVENTIONAL: "false"
          GIT_CLIFF__GIT__FILTER_COMMITS: "false"
          GIT_CLIFF__GIT__REQUIRE_CONVENTIONAL: "true"
          GIT_CLIFF__GIT__FAIL_ON_UNMATCHED_COMMIT: "true"

  # Everything that a release publishes, checked, in one artifact "dist":
  # the archives built with RELEASE_GHC, the source distributions and
  # SHA256SUMS. It runs on every event: a PR, or a manual run
  # (workflow_dispatch, on any branch), gets the same files as a release, and
  # a version mismatch fails before the release commit lands.
  dist:
    name: dist
    needs: [build, test, sdist]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-ghc-${{ env.RELEASE_GHC }}'
          path: archives
          merge-multiple: true

      - name: Download source distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: sdist

      # Every package has the same version, the version of the release, and
      # so does everything else. No archives means that RELEASE_GHC is not
      # in the matrix.
      - name: Check versions
        id: check
        run: |
          shopt -s nullglob
          versions=$(for f in sdist/*.tar.gz; do f=${f##*/}; f=${f%.tar.gz}; echo "${f##*-}"; done | sort -u)
          if [[ $(wc -l <<< "$versions") != 1 ]]; then
            echo "::error::The packages have different versions:" $versions
            exit 1
          fi
          version=$versions
          archives=(archives/*)
          if (( ${#archives[@]} == 0 )); then
            echo "::error::No release archives built with GHC $RELEASE_GHC"
            exit 1
          fi
          for f in "${archives[@]}"; do
            if [[ ${f#archives/} != "$ARCHIVE_NAME-$version-"* ]]; then
              echo "::error::$f is not an archive of version $version"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Make checksums
        run: |
          mkdir dist
          mv archives/* sdist/*.tar.gz dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # The one check that the ruleset requires: whatever the matrix becomes, it
  # fails if any job it needs failed or was cancelled. Without always(), a
  # failed job would make it skipped, and GitHub treats a skipped required
  # check as passed. commits is skipped on pushes to main, which is fine.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [build, test, sdist, dist, commits]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Publishes the dist artifact as a release when the head of main is a
  # release commit ("chore(release): VERSION"), and never on a PR or a manual
  # run. It is idempotent: a rerun continues a draft, or does nothing if the
  # release is published.
  release:
    name: release
    needs: [ci-ok, dist]
    # The implicit success() would also look at commits, which is skipped on
    # pushes, and so skip this job too. Check ci-ok's result instead.
    if: >-
      !cancelled() && needs.ci-ok.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && startsWith(github.event.head_commit.message, 'chore(release): ')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.dist.outputs.version }}
        run: |
          subject=$(git log -1 --format=%s)
          # A squash merge appends " (#123)" to the subject.
          if [[ $subject != "chore(release): $VERSION" && $subject != "chore(release): $VERSION (#"*")" ]]; then
            echo "::error::The release commit \"$subject\" does not match version $VERSION of the packages"
            exit 1
          fi
          state=$(gh release view "v$VERSION" --json isDraft \
                    --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)
          echo "v$VERSION: $state"
          {
            echo "tag=v$VERSION"
            echo "state=$state"
          } >> "$GITHUB_OUTPUT"

      - name: Download dist
        if: steps.plan.outputs.state != 'published'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Release notes
        if: steps.plan.outputs.state != 'published'
        env:
          VERSION: ${{ needs.dist.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Attest build provenance
        if: steps.plan.outputs.state != 'published'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Create the draft release
        if: steps.plan.outputs.state == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file NOTES.md

      - name: Upload and publish
        if: steps.plan.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          # The release is a draft here, so --clobber is safe on a rerun.
          gh release upload "$TAG" dist/* --clobber
          # Publishing creates the tag and locks the tag and the assets.
          gh release edit "$TAG" --draft=false --latest
