name: CI

# build compiles the executable once per target and GHC and uploads it as an
# archive; test unpacks that archive on a separate runner, without a build
# tree, and runs tests/run.sh on it; sdist makes the source distribution of
# every package in cabal.project; commits checks the commit messages of a
# PR; ci-ok is the one check that the ruleset requires; release publishes the
# tested archives and the source distributions when the head of main is a
# release commit, made by `mise run release-pr`. Nothing is rebuilt after
# testing.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CABAL_VERSION: 3.18.1.0
  # Release archives come from the builds with this GHC.
  RELEASE_GHC: 9.14.1

jobs:
  build:
    name: Build ${{ matrix.target }}, GHC ${{ matrix.ghc }}
    runs-on: ${{ matrix.build-runner }}

    strategy: &strategy
      fail-fast: false
      matrix:
        ghc:
          - 9.12.2
          - 9.14.1
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
        include:
          # Linux builds run on the oldest runner, as the binaries need a
          # glibc at least as new as the one they were built with.
          - target: x86_64-linux
            build-runner: ubuntu-22.04
            test-runner: ubuntu-latest
          - target: aarch64-linux
            build-runner: ubuntu-22.04-arm
            test-runner: ubuntu-24.04-arm
          - target: x86_64-macos
            build-runner: macos-15-intel
            test-runner: macos-15-intel
          - target: aarch64-macos
            build-runner: macos-15
            test-runner: macos-latest
          - target: x86_64-windows
            build-runner: windows-2025
            test-runner: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Plan
        run: cabal build --dry-run

      - name: Restore cabal store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: cabal-store-${{ matrix.target }}-ghc-${{ matrix.ghc }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: cabal-store-${{ matrix.target }}-ghc-${{ matrix.ghc }}-

      - name: Build dependencies
        run: cabal build --only-dependencies -j

      - name: Save cabal store
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: |
          cabal build -j
          mkdir out
          cp "$(cabal list-bin cabal-solver-plan)" out/
          version=$(sed -n 's/^version: *//p' cabal-solver-plan.cabal)
          echo "ARCHIVE=cabal-solver-plan-$version-${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: Strip
        if: runner.os != 'Windows'
        working-directory: out
        run: strip cabal-solver-plan

      # strip invalidates the linker's ad-hoc signature.
      - name: Sign
        if: runner.os == 'macOS'
        working-directory: out
        run: codesign --force --sign - cabal-solver-plan

      # The binary must only need libraries that every distribution has, with
      # a stable ABI.
      - name: Check shared libraries
        if: runner.os == 'Linux'
        working-directory: out
        run: |
          needed=$(readelf -d cabal-solver-plan | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
          echo "$needed"
          if grep -vxE 'libc\.so\.6|libm\.so\.6|libz\.so\.1|libgmp\.so\.10|ld-linux-.*\.so\.[0-9]+' <<< "$needed"; then
            echo "::error::unexpected shared library dependencies (above)"
            exit 1
          fi

      # Only system libraries; e.g. no Homebrew gmp.
      - name: Check shared libraries
        if: runner.os == 'macOS'
        working-directory: out
        run: |
          needed=$(otool -L cabal-solver-plan | tail -n +2 | awk '{print $1}')
          echo "$needed"
          if grep -vE '^(/usr/lib/|/System/Library/)' <<< "$needed"; then
            echo "::error::unexpected shared library dependencies (above)"
            exit 1
          fi

      - name: Archive
        if: runner.os != 'Windows'
        working-directory: out
        run: tar -czf "../$ARCHIVE.tar.gz" cabal-solver-plan

      - name: Archive
        if: runner.os == 'Windows'
        working-directory: out
        run: 7z a "../$ARCHIVE.zip" cabal-solver-plan.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-ghc-${{ matrix.ghc }}
          path: ${{ env.ARCHIVE }}.*
          if-no-files-found: error

  test:
    name: Test ${{ matrix.target }}, GHC ${{ matrix.ghc }}
    needs: build
    runs-on: ${{ matrix.test-runner }}
    strategy: *strategy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target }}-ghc-${{ matrix.ghc }}
          path: artifact

      - name: Unpack
        if: runner.os != 'Windows'
        run: mkdir bin && tar -xzf artifact/*.tar.gz -C bin

      - name: Unpack
        if: runner.os == 'Windows'
        run: 7z x -obin artifact/*.zip

      # Only for the smoke test with --with-ghc.
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: false

      # The golden tests only read the index up to a fixed index-state, so an
      # old copy of it is as good as a new one.
      - name: Cache Hackage index
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _cache
          key: hackage-index-${{ runner.os }}

      - name: Test
        run: sh tests/run.sh bin/cabal-solver-plan

  # The source distributions of every package in cabal.project, as cabal
  # sdist makes them: only the files that the .cabal files list, unlike a
  # checkout of the repository. cabal sdist needs no GHC and its tarballs
  # are reproducible.
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ env.RELEASE_GHC }}
          cabal-version: ${{ env.CABAL_VERSION }}
          cabal-update: false

      - name: Make source distributions
        run: cabal sdist all -o sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: sdist/*.tar.gz
          if-no-files-found: error

  # Every commit of a PR must follow Conventional Commits, with a type that a
  # commit parser in cliff.toml knows: the release task reads them to choose
  # the next version and to write CHANGELOG.md. git-cliff checks the PR's
  # commits with cliff.toml, without the filters that drop unconventional and
  # unmatched commits from the changelog, and fails on either kind.
  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Conventional Commits
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          # The same version as in mise.toml.
          version: v2.14.2
          args: --verbose origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}
        env:
          GIT_CLIFF__GIT__FILTER_UNCONVENTIONAL: "false"
          GIT_CLIFF__GIT__FILTER_COMMITS: "false"
          GIT_CLIFF__GIT__REQUIRE_CONVENTIONAL: "true"
          GIT_CLIFF__GIT__FAIL_ON_UNMATCHED_COMMIT: "true"

  # The one check that the ruleset requires: whatever the matrix becomes, it
  # fails if any job it needs failed or was cancelled. Without always(), a
  # failed job would make it skipped, and GitHub treats a skipped required
  # check as passed. commits is skipped on pushes to main, which is fine.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [build, test, sdist, commits]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Publishes a release when the head of main is a release commit
  # ("chore(release): VERSION"). It is idempotent: a rerun continues a draft,
  # or does nothing if the release is published.
  release:
    name: release
    needs: ci-ok
    # The implicit success() would also look at commits, which is skipped on
    # pushes, and so skip this job too. Check ci-ok's result instead.
    if: >-
      !cancelled() && needs.ci-ok.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && startsWith(github.event.head_commit.message, 'chore(release): ')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^version:[[:space:]]+//p' ./*.cabal)
          subject=$(git log -1 --format=%s)
          # A squash merge appends " (#123)" to the subject.
          if [[ $subject != "chore(release): $version" && $subject != "chore(release): $version (#"*")" ]]; then
            echo "::error::The release commit \"$subject\" does not match version $version in the .cabal file"
            exit 1
          fi
          state=$(gh release view "v$version" --json isDraft \
                    --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)
          echo "v$version: $state"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "state=$state"
          } >> "$GITHUB_OUTPUT"

      - name: Download release archives
        if: steps.plan.outputs.state != 'published'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-ghc-${{ env.RELEASE_GHC }}'
          path: dist
          merge-multiple: true

      - name: Download source distributions
        if: steps.plan.outputs.state != 'published'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist

      - name: Make checksums and release notes
        if: steps.plan.outputs.state != 'published'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
          awk -v v="$VERSION" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Attest build provenance
        if: steps.plan.outputs.state != 'published'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Create the draft release
        if: steps.plan.outputs.state == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file NOTES.md

      - name: Upload and publish
        if: steps.plan.outputs.state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          # The release is a draft here, so --clobber is safe on a rerun.
          gh release upload "$TAG" dist/* --clobber
          # Publishing creates the tag and locks the tag and the assets.
          gh release edit "$TAG" --draft=false --latest
