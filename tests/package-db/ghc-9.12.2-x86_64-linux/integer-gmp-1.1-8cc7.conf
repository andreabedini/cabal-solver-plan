name:                 integer-gmp
version:              1.1
visibility:           public
id:                   integer-gmp-1.1-8cc7
key:                  integer-gmp-1.1-8cc7
license:              BSD-3-Clause
maintainer:           hvr@gnu.org
author:               Herbert Valerio Riedel
homepage:             https://www.haskell.org/ghc/
synopsis:             Integer library based on GMP
description:
    This package used to provide an implementation of the standard 'Integer'
    type based on the
    <http://gmplib.org/ GNU Multiple Precision Arithmetic Library (GMP)>.

    It is now deprecated in favor of the 'ghc-bignum' package.

    Its purpose is to provide backward compatibility for codes directly
    depending on the `integer-gmp` package.

category:             Numeric, Algebra
abi:                  5df976042c83f4b8adc17fb1e740c99b
exposed:              True
exposed-modules:      GHC.Integer.GMP.Internals
import-dirs:
    ${pkgroot}/../lib/x86_64-linux-ghc-9.12.2-5a14/integer-gmp-1.1-8cc7

library-dirs:
    ${pkgroot}/../lib/x86_64-linux-ghc-9.12.2-5a14/integer-gmp-1.1-8cc7

library-dirs-static:
    ${pkgroot}/../lib/x86_64-linux-ghc-9.12.2-5a14/integer-gmp-1.1-8cc7

dynamic-library-dirs: ${pkgroot}/../lib/x86_64-linux-ghc-9.12.2-5a14
data-dir:
    ${pkgroot}/../share/x86_64-linux-ghc-9.12.2-5a14/integer-gmp-1.1

hs-libraries:         HSinteger-gmp-1.1-8cc7
depends:
    base-4.21.0.0-5b43 ghc-bignum-1.3-700c ghc-internal-9.1202.0-59e9
    ghc-prim-0.13.0-ca1e

haddock-interfaces: "${pkgroot}/../../../share/doc/ghc-9.12.2/html/libraries/integer-gmp-1.1-8cc7/integer-gmp.haddock"


haddock-html: "${pkgroot}/../../../share/doc/ghc-9.12.2/html/libraries/integer-gmp-1.1-8cc7"
