    containers-0.7-40d4 deepseq-1.5.1.0-d09f directory-1.3.9.0-cbf1
    filepath-1.5.4.0-04d4 ghc-boot-th-9.12.2-11fa
    ghc-platform-0.1.0.0-802b unix-2.8.6.0-402c

haddock-interfaces: "${pkgroot}/../../../share/doc/ghc-9.12.2/html/libraries/ghc-boot-9.12.2-8819/ghc-boot.haddock"


