name:                 ghc-boot
version:              9.12.2
visibility:           public
id:                   ghc-boot-9.12.2-8819
key:                  ghc-boot-9.12.2-8819
license:              BSD-3-Clause
maintainer:           ghc-devs@haskell.org
synopsis:             Shared functionality between GHC and its boot libraries
description:
    This library is shared between GHC, ghc-pkg, and other boot
    libraries.
    .
    A note about "GHC.Unit.Database": it only deals with the subset of
    the package database that the compiler cares about: modules
    paths etc and not package metadata like description, authors
    etc. It is thus not a library interface to ghc-pkg and is *not*
    suitable for modifying GHC package databases.
    .
    The package database format and this library are constructed in
    such a way that while ghc-pkg depends on Cabal, the GHC library
    and program do not have to depend on Cabal.

category:             GHC
abi:                  290ebe6ab36751032eb7013ac26d48c5
exposed:              True
exposed-modules:
    GHC.BaseDir, GHC.Data.ShortText, GHC.Data.SizedSeq,
    GHC.ForeignSrcLang,
    GHC.ForeignSrcLang.Type from ghc-boot-th-9.12.2-11fa:GHC.ForeignSrcLang.Type,
    GHC.HandleEncoding, GHC.LanguageExtensions,
    GHC.LanguageExtensions.Type from ghc-boot-th-9.12.2-11fa:GHC.LanguageExtensions.Type,
    GHC.Lexeme from ghc-boot-th-9.12.2-11fa:GHC.Lexeme,
    GHC.Platform.ArchOS from ghc-platform-0.1.0.0-802b:GHC.Platform.ArchOS,
    GHC.Platform.Host, GHC.Serialized, GHC.Settings.Utils,
    GHC.UniqueSubdir, GHC.Unit.Database, GHC.Utils.Encoding,
    GHC.Utils.Encoding.UTF8, GHC.Version

import-dirs:
    ${pkgroot}/../lib/x86_64-linux-ghc-9.12.2-5a14/ghc-boot-9.12.2-8819

library-dirs:
    ${pkgroot}/../lib/x86_64-linux-ghc-9.12.2-5a14/ghc-boot-9.12.2-8819

library-dirs-static:
    ${pkgroot}/../lib/x86_64-linux-ghc-9.12.2-5a14/ghc-boot-9.12.2-8819

dynamic-library-dirs: ${pkgroot}/../lib/x86_64-linux-ghc-9.12.2-5a14
data-dir:
    ${pkgroot}/../share/x86_64-linux-ghc-9.12.2-5a14/ghc-boot-9.12.2

hs-libraries:         HSghc-boot-9.12.2-8819
depends:
