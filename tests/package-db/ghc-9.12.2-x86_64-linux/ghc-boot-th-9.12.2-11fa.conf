name:                 ghc-boot-th
version:              9.12.2
visibility:           public
id:                   ghc-boot-th-9.12.2-11fa
key:                  ghc-boot-th-9.12.2-11fa
license:              BSD-3-Clause
maintainer:           ghc-devs@haskell.org
synopsis:
    Shared functionality between GHC and the @template-haskell@
    library

description:
    This library contains various bits shared between the @ghc@ and
    @template-haskell@ libraries.

    This package exists to ensure that @template-haskell@ has a
    minimal set of transitive dependencies, since it is intended to
    be depended upon by user code.

category:             GHC
abi:                  595e44db4407210201ee63024b58878d
exposed:              True
exposed-modules:
    GHC.ForeignSrcLang.Type,
    GHC.Internal.TH.Lib from ghc-internal-9.1202.0-59e9:GHC.Internal.TH.Lib,
    GHC.Internal.TH.Lib.Map,
    GHC.Internal.TH.Lift from ghc-internal-9.1202.0-59e9:GHC.Internal.TH.Lift,
    GHC.Internal.TH.Ppr, GHC.Internal.TH.PprLib,
    GHC.Internal.TH.Quote from ghc-internal-9.1202.0-59e9:GHC.Internal.TH.Quote,
    GHC.Internal.TH.Syntax from ghc-internal-9.1202.0-59e9:GHC.Internal.TH.Syntax,
    GHC.LanguageExtensions.Type, GHC.Lexeme

import-dirs:
    ${pkgroot}/../lib/x86_64-linux-ghc-9.12.2-5a14/ghc-boot-th-9.12.2-11fa

library-dirs:
    ${pkgroot}/../lib/x86_64-linux-ghc-9.12.2-5a14/ghc-boot-th-9.12.2-11fa

library-dirs-static:
    ${pkgroot}/../lib/x86_64-linux-ghc-9.12.2-5a14/ghc-boot-th-9.12.2-11fa

dynamic-library-dirs: ${pkgroot}/../lib/x86_64-linux-ghc-9.12.2-5a14
data-dir:
    ${pkgroot}/../share/x86_64-linux-ghc-9.12.2-5a14/ghc-boot-th-9.12.2

hs-libraries:         HSghc-boot-th-9.12.2-11fa
depends:
    base-4.21.0.0-5b43 ghc-internal-9.1202.0-59e9 ghc-prim-0.13.0-ca1e
    pretty-1.1.3.6-fe6c

haddock-interfaces: "${pkgroot}/../../../share/doc/ghc-9.12.2/html/libraries/ghc-boot-th-9.12.2-11fa/ghc-boot-th.haddock"


