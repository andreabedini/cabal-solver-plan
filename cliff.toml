# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# A Tera template to be rendered as the changelog's header.
# See https://keats.github.io/tera/#getting-started
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and versions follow the [Haskell PVP](https://pvp.haskell.org/), as described in [CONTRIBUTING.md](CONTRIBUTING.md).\n
"""
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/#getting-started
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/#getting-started
footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/andreabedini/cabal-solver-plan\
                /compare/{{ release.previous.version }}...{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/andreabedini/cabal-solver-plan\
                /releases/tag/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: https://github.com/andreabedini/cabal-solver-plan\
            /compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = true
# Exclude commits that no commit parser below assigns to a group.
filter_commits = true
# Keep breaking commits even when a commit parser below skips them.
protect_breaking_commits = true
# Only four-component release tags, such as v0.1.0.0.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$"
# Assign commits to the groups of Keep a Changelog. The comments order the
# groups in CHANGELOG.md. A breaking change of a type that is otherwise
# skipped, such as refactor!, goes to "Changed".
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^fix",  group = "<!-- 2 -->Fixed" },
  { field = "breaking", pattern = "true", group = "<!-- 1 -->Changed" },
  { message = "^(docs|ci|test|refactor|build|chore|style|revert)", skip = true },
]
# Order releases topologically instead of chronologically.
topo_order = false
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"

# .mise/tasks/release-pr takes the next version from `git cliff
# --bumped-version`. With versions A.B.C.D, git-cliff bumps the last three
# components as SemVer would: a breaking change bumps B, feat bumps C, fix
# and perf bump D. A changes only by hand. These are git-cliff's defaults,
# set here so that the 0.x versions are not treated specially.
[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
# The version of the first release, when there is no tag yet.
initial_tag = "v0.1.0.0"
